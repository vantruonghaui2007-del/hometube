name: Build HomeTube APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOMETUBE_KEYSTORE: /tmp/hometube-${{ github.run_id }}-${{ github.run_attempt }}.jks
      HOMETUBE_KEYSTORE_PASSWORD: ${{ secrets.HOMETUBE_KEYSTORE_PASSWORD }}
      HOMETUBE_KEY_ALIAS: ${{ secrets.HOMETUBE_KEY_ALIAS }}
      HOMETUBE_KEY_PASSWORD: ${{ secrets.HOMETUBE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HOMETUBE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing HomeTube signing secrets'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOMETUBE_KEYSTORE"
          chmod 600 "$HOMETUBE_KEYSTORE"
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test and build signed APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verify Android 4.4 signature and package APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/HomeTube.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --min-sdk-version 19 out/HomeTube.apk | tee out/signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' out/signature.txt
          cd out
          sha256sum HomeTube.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HomeTube-APK
          path: out/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HomeTube-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$HOMETUBE_KEYSTORE"
